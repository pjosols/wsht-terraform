# CI workflow: validate, test, and scan all Terraform modules.
# Runs on push to main and all pull requests.
# Validate job skips cloudfront and waf (provider alias incompatible with standalone validate).
# Test job includes all modules using terraform test with mock providers.
# Checkov scans all modules for security and best-practice violations.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every module except cloudfront and waf, which declare
        # configuration_aliases = [aws.us_east_1] and cannot be validated standalone —
        # they are covered by terraform test via mock_provider.
        module: [acm, apigw, app_server, bedrock_kb_s3vectors, cognito, kms, lambda_container,
          monitoring, org_account, s3_bucket, s3_vectors, secrets_consumer, secrets_vault,
          ses_inbound, tfstate_backend]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: fmt check
        run: terraform fmt -check -recursive
        working-directory: modules/${{ matrix.module }}
      - name: init
        run: terraform init -backend=false
        working-directory: modules/${{ matrix.module }}
      - name: validate
        run: terraform validate
        working-directory: modules/${{ matrix.module }}

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        # Every module that has a tests/ directory. bedrock_kb_s3vectors, s3_vectors and
        # ses_inbound have none yet, so they are validate-only until someone writes them.
        module: [acm, apigw, app_server, cloudfront, cognito, kms, lambda_container, monitoring,
          org_account, s3_bucket, secrets_consumer, secrets_vault, tfstate_backend, waf]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: init
        run: terraform init -backend=false
        working-directory: modules/${{ matrix.module }}
      - name: test
        run: terraform test
        working-directory: modules/${{ matrix.module }}

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: modules
          config_file: .checkov.yaml
          framework: terraform

  # The single required status check on main. Branch protection names contexts as
  # literal strings, so requiring the matrix jobs directly means a new module's check
  # is silently NOT required until someone remembers to add it — and a removed module
  # blocks every PR forever waiting on a context that never reports. This job needs
  # them all, so the matrix can change freely and protection keeps working.
  #
  # `needs` alone is not enough: a skipped or cancelled dependency leaves this job
  # "successful" by default, which would hand main a green gate over work that never
  # ran. Hence the explicit result check.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [validate, test, checkov]
    if: always()
    steps:
      - name: Verify every upstream job succeeded
        run: |
          results="validate=${{ needs.validate.result }} test=${{ needs.test.result }} checkov=${{ needs.checkov.result }}"
          echo "$results"
          case "$results" in
            *failure*|*cancelled*|*skipped*)
              echo "::error::One or more CI jobs did not succeed: $results"
              exit 1
              ;;
          esac
